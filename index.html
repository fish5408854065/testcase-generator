<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Case 生成器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 4px; font-size: 24px; }
    .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h3 { color: #333; margin-bottom: 16px; font-size: 16px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 150px; }
    .form-group label { display: block; color: #666; font-size: 13px; margin-bottom: 6px; }
    .form-group select, .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }
    .form-group select:focus, .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #4ecdc4;
    }
    textarea { resize: vertical; min-height: 120px; }
    .btn-row { display: flex; gap: 12px; margin-top: 16px; }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #4ecdc4; color: white; }
    .btn-primary:hover { background: #3dbdb5; }
    .btn-secondary { background: #e8e8e8; color: #333; }
    .btn-secondary:hover { background: #ddd; }
    .output-box {
      background: #1a1a2e;
      color: #a8e6cf;
      padding: 20px;
      border-radius: 12px;
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.8;
      overflow-x: auto;
    }
    .preview-label { color: #666; font-size: 13px; margin-top: 16px; margin-bottom: 8px; }
    .flutter-fields { display: none; border-top: 1px dashed #e8e8e8; padding-top: 16px; margin-top: 8px; }
    .flutter-fields.visible { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Test Case 生成器</h1>
    <p class="subtitle">自动产出 Bug 标题与内容格式</p>

    <div class="card">
      <h3>📋 基本信息</h3>
      <div class="form-row">
        <div class="form-group">
          <label>环境</label>
          <select id="env">
            <option value="UAT" selected>UAT</option>
            <option value="SIT">SIT</option>
            <option value="PROD">PROD</option>
          </select>
        </div>
        <div class="form-group">
          <label>前后端</label>
          <select id="feBe">
            <option value="FE">FE</option>
            <option value="BE">BE</option>
          </select>
        </div>
        <div class="form-group">
          <label>测试平台</label>
          <select id="platform">
            <option value="M1">M1</option>
            <option value="M2">M2</option>
            <option value="M5">M5</option>
            <option value="M7">M7</option>
            <option value="M8">M8</option>
            <option value="M9">M9</option>
            <option value="Flutter">Flutter</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>测试帐号</label>
          <input type="text" id="account" placeholder="填入测试帐号">
        </div>
        <div class="form-group">
          <label>FE 版本</label>
          <input type="text" id="feVersion" placeholder="如: 2.1.0">
        </div>
        <div class="form-group">
          <label>BE 版本</label>
          <input type="text" id="beVersion" placeholder="如: 1.5.2">
        </div>
      </div>
      <div class="form-group">
        <label>Bug 标题（可留空自动产生）</label>
        <input type="text" id="bugTitle" placeholder="留空则自动产生格式标题">
      </div>

      <div class="flutter-fields" id="flutterFields">
        <div class="form-row">
          <div class="form-group">
            <label>📱 手机型号</label>
            <input type="text" id="phoneModel" placeholder="如: iPhone 15 Pro">
          </div>
          <div class="form-group">
            <label>🍎 iOS 版本</label>
            <input type="text" id="iosVersion" placeholder="如: 17.2">
          </div>
          <div class="form-group">
            <label>🤖 Android 版本</label>
            <input type="text" id="androidVersion" placeholder="如: 14">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>📝 测试内容</h3>
      <div class="form-group">
        <label>测试步骤</label>
        <textarea id="testSteps" placeholder="1. 进入页面&#10;2. 点击按钮&#10;3. 观察结果"></textarea>
      </div>
      <div class="form-group">
        <label>测试结果（Bug 描述）</label>
        <textarea id="testResult" placeholder="描述实际发生的错误行为"></textarea>
      </div>
      <div class="form-group">
        <label>预期结果</label>
        <textarea id="expectedResult" placeholder="描述预期应该发生的正确行为"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="generate()">🔄 产生 Test Case</button>
        <button class="btn btn-secondary" onclick="copyOutput()">📋 复制内容</button>
        <button class="btn btn-secondary" onclick="clearAll()">🗑 清空</button>
      </div>
    </div>

    <div class="preview-label">📄 预览</div>
    <div class="output-box" id="output">选择并填写上方字段后，点击「产生 Test Case」</div>
  </div>

  <script>
    const STORAGE_KEY = 'testcase_form_data';

    function getToday() {
      const now = new Date();
      const pad = n => n.toString().padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    function saveFormData() {
      const data = {
        env: document.getElementById('env').value,
        feBe: document.getElementById('feBe').value,
        platform: document.getElementById('platform').value,
        account: document.getElementById('account').value,
        feVersion: document.getElementById('feVersion').value,
        beVersion: document.getElementById('beVersion').value,
        bugTitle: document.getElementById('bugTitle').value,
        testSteps: document.getElementById('testSteps').value,
        testResult: document.getElementById('testResult').value,
        expectedResult: document.getElementById('expectedResult').value,
        phoneModel: document.getElementById('phoneModel').value,
        iosVersion: document.getElementById('iosVersion').value,
        androidVersion: document.getElementById('androidVersion').value
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadFormData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      try {
        const data = JSON.parse(saved);
        if (data.env) document.getElementById('env').value = data.env;
        if (data.feBe) document.getElementById('feBe').value = data.feBe;
        if (data.platform) document.getElementById('platform').value = data.platform;
        if (data.account) document.getElementById('account').value = data.account;
        if (data.feVersion) document.getElementById('feVersion').value = data.feVersion;
        if (data.beVersion) document.getElementById('beVersion').value = data.beVersion;
        if (data.bugTitle) document.getElementById('bugTitle').value = data.bugTitle;
        if (data.testSteps) document.getElementById('testSteps').value = data.testSteps;
        if (data.testResult) document.getElementById('testResult').value = data.testResult;
        if (data.expectedResult) document.getElementById('expectedResult').value = data.expectedResult;
        if (data.phoneModel) document.getElementById('phoneModel').value = data.phoneModel;
        if (data.iosVersion) document.getElementById('iosVersion').value = data.iosVersion;
        if (data.androidVersion) document.getElementById('androidVersion').value = data.androidVersion;
      } catch (e) {}
    }

    loadFormData();
    toggleFlutterFields(); // init on load

    // Auto-save on every input change
    document.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', saveFormData);
      el.addEventListener('change', saveFormData);
    });

    function toggleFlutterFields() {
      const platform = document.getElementById('platform').value;
      const flutterSection = document.getElementById('flutterFields');
      if (platform === 'Flutter') {
        flutterSection.classList.add('visible');
      } else {
        flutterSection.classList.remove('visible');
      }
    }

    function generate() {
      const env = document.getElementById('env').value;
      const feBe = document.getElementById('feBe').value;
      const platform = document.getElementById('platform').value;
      const account = document.getElementById('account').value || 'N/A';
      const feVersion = document.getElementById('feVersion').value || 'N/A';
      const beVersion = document.getElementById('beVersion').value || 'N/A';
      const bugTitle = document.getElementById('bugTitle').value;
      const testSteps = document.getElementById('testSteps').value || '（未填写）';
      const testResult = document.getElementById('testResult').value || '（未填写）';
      const expectedResult = document.getElementById('expectedResult').value || '（未填写）';
      const today = getToday();

      const isFlutter = platform === 'Flutter';
      const phoneModel = document.getElementById('phoneModel').value || 'N/A';
      const iosVersion = document.getElementById('iosVersion').value || 'N/A';
      const androidVersion = document.getElementById('androidVersion').value || 'N/A';

      let title = bugTitle.trim();
      if (!title || title.length < 3) {
        title = `[${env}][${feBe}][${platform}] Bug - 预期行为异常`;
      }

      let testInfo = `  测试环境：${env}
  测试帐号：${account}
  测试日期 / 测试时间：${today}
  测试版本：F: ${feVersion}  B: ${beVersion}`;

      if (isFlutter) {
        testInfo += `
  手机型号：${phoneModel}
  iOS 版本：${iosVersion}
  Android 版本：${androidVersion}`;
      }

      const output = `【标题】
${title}

【测试资讯】
${testInfo}

【测试步骤】
${testSteps}

【测试结果】
${testResult}

【预期结果】
${expectedResult}`;

      document.getElementById('output').textContent = output;
      saveFormData();
    }

    function copyOutput() {
      const text = document.getElementById('output').textContent;
      if (!text || text === '选择并填写上方字段后，点击「产生 Test Case」') {
        alert('请先生成 Test Case');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('已复制到剪贴板！');
      }).catch(() => {
        prompt('复制失败，请手动选取复制：', text);
      });
    }

    function clearAll() {
      document.querySelectorAll('input, textarea').forEach(el => el.value = '');
      document.getElementById('output').textContent = '选择并填写上方字段后，点击「产生 Test Case」';
      localStorage.removeItem(STORAGE_KEY);
      toggleFlutterFields();
    }
  </script>
</body>
</html>
